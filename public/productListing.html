<!DOCTYPE html>
<html lang="en">
<!-- 
            Civic Threads Apparel - Product Page
            Author: Bridget Flanery, Lilly Mena, Matthew Yates, Hayden Harris, Nico Morente
            Description: Product page for Civic Threads Apparel showcasing sustainable clothing.
        -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civic Threads Apparel</title>
    <script src="https://cdn.shopify.com/storefront/web-components.js" async>
    </script>
    <link rel="stylesheet" href="../styles/styles.css">
    <script src="../src/app.js" defer></script>
</head>

<body>
    <header>
        <a href="index.html">Civic / Threads</a>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="./productListing.html">Shop</a></li>
                <li><a href="./aboutPage.html">About Us</a></li>
                <li>
                    <button onclick="getElementById('cart').showModal();">
                        <img src="../assets/icons/shopingCartIcon.png" alt="Cart">
                    </button>
                </li>
            </ul>
        </nav>
    </header>


    <main>
        <shopify-store store-domain="civicthreads-store.myshopify.com" country="US" language="en"
            public-access-token="a666c1f30c44e51fbf7304aef2b9de15">
            <shopify-cart id="cart"></shopify-cart>

        </shopify-store>

        <shopify-list-context type="product" query="products" first="10" sortkey="TITLE">
            <template>
                <article shopify-attr--data-id="product.handle" class="product">
                    <shopify-media width="200" height="300" query="product.featuredImage"></shopify-media>
                    <h2>
                        <shopify-data query="product.title"></shopify-data>
                    </h2>
                    <shopify-data query="product.vendor"></shopify-data>
                    <shopify-data query="product.description"></shopify-data>
                    <shopify-money query="product.selectedOrFirstAvailableVariant.price" format="money_with_currency">
                    </shopify-money>
                    <a href="./product.html?">Details</a>
                </article>
            </template>
            </shopify-context>

    </main>
    <!-- Footer -->
    <footer class="footer">
        <a href="index.html">Civic / Threads</a>
        <p>Shop with those you trust.</p>
        <div>
            <a href="./productListing.html">Shop Us</a>
            <a href="./aboutPage.html">About Us</a>
        </div>
        <div>
            <a href="#"><img class="homeLogo" src="../assets/logos/CivicThreads_Logo_White_Crop.png"
                    alt="Civic Threads"></a>
        </div>
    </footer>
</body>

</html>
