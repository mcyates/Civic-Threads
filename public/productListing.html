<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civic Threads Apparel</title>
    <script src="https://cdn.shopify.com/storefront/web-components.js" async>
    </script>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="./aboutPage.html">About</a></li>
                <li><a href="./productListing.html">Shop</a></li>
                <li><a href="./checkout.html">Checkout</a></li>
            </ul>
        </nav>
        <h1>Shop</h1>
    </header>


    <main>
        <shopify-store store-domain="civic-threads-dev.myshopify.com" country="US" language="en"
            public-access-token="7c491e3417403558712288f3c692aa8c">
        </shopify-store>

        <shopify-list-context type="product" query="products" first="10">
            <template>
                <article shopify-attr--data-id="product.handle" class="product">

                    <shopify-media width="200" height="300" query="product.featuredImage"></shopify-media>
                    <h2>
                        <shopify-data query="product.title"></shopify-data>
                    </h2>
                    <shopify-data query="product.vendor"></shopify-data>
                    <shopify-data query="product.description"></shopify-data>
                    <shopify-money query="product.selectedOrFirstAvailableVariant.price" format="money_with_currency">
                    </shopify-money>
                    <a href="./product.html?"></a>
                </article>
            </template>
            </shopify-context>
    </main>
    <script src="../src/app.js" defer></script>
</body>

</html>
