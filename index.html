<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civic Threads Apparel</title>
    <script src="https://cdn.shopify.com/storefront/web-components.js" async></script>
    <script src="./src/app.js" defer></script>
    <link rel="stylesheet" href="./styles/styles.css">
</head>

<body>
    <shopify-store store-domain="civicthreads-store.myshopify.com" country="US" language="en"
        public-access-token="a666c1f30c44e51fbf7304aef2b9de15">
        <shopify-cart id="cart"></shopify-cart>
    </shopify-store>

    <header>
        <nav>
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="./public/aboutPage.html">About</a></li>
                <li><a href="./public/productListing.html">Shop</a></li>
                <li>
                    <button onclick="getElementById('cart').showModal();">
                        Show Cart
                    </button>
                </li>
            </ul>
        </nav>
        <h1>Home</h1>
    </header>
    <main>

        <shopify-context type="collection" handle="unisex-shirts">
            <template>
                <h2>
                    <span>Check out our latest collection: </span>
                    <shopify-data query="collection.title"></shopify-data>
                </h2>
                <shopify-list-context type="product" query="collection.products" first="12">
                    <template>
                        <article shopify-attr--data-id="product.handle" class="product">
                            <shopify-media width="200" height="300" query="product.featuredImage"></shopify-media>
                            <shopify-data query="product.title"></shopify-data>
                            <shopify-data query="product.vendor"></shopify-data>
                            <shopify-data query="product.description"></shopify-data>
                            <a href="./public/product.html?">Details</a>
                        </article>
                    </template>
                </shopify-list-context>
            </template>
        </shopify-context>
    </main>

</body>

</html>
